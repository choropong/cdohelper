<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성지키기 헬퍼</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .menu-icon { font-size: 1.4rem; }
        .menu-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .menu-title { font-weight: 600; }
        .menu-desc { font-size: 0.75rem; opacity: 0.5; font-weight: 400; }
        .footer { margin-top: auto; padding-top: 60px; font-size: 0.75rem; opacity: 0.3; }
    </style>
</head>
<body>
    <h1 class="title">성지키기 헬퍼</h1>
    <div class="menu-container">
        <a href="soul.html" class="menu-btn">
            <span class="menu-icon"></span>
            <span class="menu-text">
                <span class="menu-title">영혼 계산기</span>
                <span class="menu-desc">영혼 확률 계산 및 시뮬레이션</span>
            </span>
        </a>
        <a href="tower.html" class="menu-btn">
            <span class="menu-icon"></span>
            <span class="menu-text">
                <span class="menu-title">13타워 도우미</span>
                <span class="menu-desc">라운드 타이머 및 몹 정보</span>
            </span>
        </a>
    </div>
    <div class="footer">© 2026 CDO Helper. All Rights Reserved.</div>
</body>
</html>
