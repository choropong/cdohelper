<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펫 뽑기 확률표 - 성지키기 헬퍼</title>
    
    <meta name="description" content="성지키기 펫 뽑기 확률표 - Made by 얼음(짭)">
    <meta name="author" content="얼음(짭)">
    <meta property="og:type" content="website">
    <meta property="og:title" content="펫 뽑기 확률표 - 성지키기 헬퍼">
    <meta property="og:description" content="Made by 얼음(짭)">
    <meta property="og:image" content="images/icon.png">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="펫 뽑기 확률표 - 성지키기 헬퍼">
    <meta name="twitter:description" content="Made by 얼음(짭)">
    <meta name="twitter:image" content="images/icon.png">
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: rgba(255,255,255,0.03);
            --bg-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.1);
            --border-light: rgba(255,255,255,0.06);
            --primary: #6366f1;
            --primary-glow: rgba(99,102,241,0.3);
            --text: #fff;
            --text-muted: rgba(255,255,255,0.5);
            --text-dim: rgba(255,255,255,0.35);
            --grade-s: #ff5555; --grade-s-bg: rgba(255,85,85,0.15);
            --grade-a: #a855f7; --grade-a-bg: rgba(168,85,247,0.15);
            --grade-b: #f7d24b; --grade-b-bg: rgba(247,210,75,0.15);
            --grade-c: #4a8cff; --grade-c-bg: rgba(74,140,255,0.15);
            --grade-d: #51c26f; --grade-d-bg: rgba(81,194,111,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-main); color: var(--text); min-height: 100vh; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
        
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: 0.9rem; cursor: pointer; text-decoration: none; margin-bottom: 20px; transition: all 0.2s; }
        .back-btn:hover { background: var(--bg-hover); border-color: rgba(255,255,255,0.2); }
        
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        header p { font-size: 0.85rem; opacity: 0.5; margin-top: 8px; }
        
        .tab-nav { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { padding: 12px 28px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font: 600 0.95rem inherit; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .tab-btn:hover { background: var(--bg-hover); }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .section-title h2 { font-size: 1.15rem; font-weight: 700; }
        .pill { font-size: 0.75rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); background: rgba(255,255,255,0.02); white-space: nowrap; }
        
        .table-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
        @media (max-width: 700px) { .table-grid { grid-template-columns: 1fr; } }
        .table-box { background: rgba(255,255,255,0.02); border-radius: 12px; padding: 16px; border: 1px solid var(--border-light); }
        .table-box-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border-light); }
        th { background: var(--primary-glow); font-weight: 700; font-size: 0.8rem; }
        tr:last-child td { border-bottom: none; }
        
        .hr { height: 1px; background: var(--border); margin: 24px 0; }
        .grade-info { font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid var(--border-light); }
        .grade-info div { display: flex; align-items: center; gap: 8px; }
        .grade-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        
        .rows { display: flex; flex-direction: column; gap: 16px; }
        .row { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.01); }
        .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-light); }
        .left-head { display: flex; align-items: center; gap: 12px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .grade { font-weight: 800; font-size: 1rem; letter-spacing: 0.3px; }
        .prob { font-weight: 700; font-size: 0.85rem; color: var(--text-muted); }
        
        .row.S .dot { background: var(--grade-s); box-shadow: 0 0 10px var(--grade-s); }
        .row.S .grade { color: var(--grade-s); }
        .row.S .row-head { background: var(--grade-s-bg); }
        .row.A .dot { background: var(--grade-a); box-shadow: 0 0 10px var(--grade-a); }
        .row.A .grade { color: var(--grade-a); }
        .row.A .row-head { background: var(--grade-a-bg); }
        .row.B .dot { background: var(--grade-b); box-shadow: 0 0 10px var(--grade-b); }
        .row.B .grade { color: var(--grade-b); }
        .row.B .row-head { background: var(--grade-b-bg); }
        .row.C .dot { background: var(--grade-c); box-shadow: 0 0 10px var(--grade-c); }
        .row.C .grade { color: var(--grade-c); }
        .row.C .row-head { background: var(--grade-c-bg); }
        .row.D .dot { background: var(--grade-d); }
        .row.D .grade { color: var(--grade-d); }
        .row.D .row-head { background: var(--grade-d-bg); }
        
        .pet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 16px; }
        @media (max-width: 900px) { .pet-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .pet-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 400px) { .pet-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .pet-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-light); border-radius: 12px; padding: 12px 8px; text-align: center; transition: all 0.2s; }
        .pet-item:hover { background: var(--bg-hover); border-color: var(--border); transform: translateY(-2px); }
        .pet-icon { width: 70px; height: 70px; border-radius: 14px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); overflow: hidden; }
        .pet-icon img { width: 100%; height: 100%; object-fit: cover; }
        .pet-name { font-size: 0.8rem; font-weight: 700; line-height: 1.3; min-height: 36px; display: flex; align-items: center; justify-content: center; }
        .pet-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; font-weight: 600; }
        
        .row.S .pet-item { background: var(--grade-s-bg); border-color: rgba(255,85,85,0.2); }
        .row.S .pet-item:hover { border-color: rgba(255,85,85,0.4); }
        .row.A .pet-item { background: var(--grade-a-bg); border-color: rgba(168,85,247,0.2); }
        .row.A .pet-item:hover { border-color: rgba(168,85,247,0.4); }
        .row.B .pet-item { background: var(--grade-b-bg); border-color: rgba(247,210,75,0.2); }
        .row.B .pet-item:hover { border-color: rgba(247,210,75,0.4); }
        .row.C .pet-item { background: var(--grade-c-bg); border-color: rgba(74,140,255,0.2); }
        .row.C .pet-item:hover { border-color: rgba(74,140,255,0.4); }
        .row.D .pet-item { background: var(--grade-d-bg); border-color: rgba(81,194,111,0.2); }
        .row.D .pet-item:hover { border-color: rgba(81,194,111,0.4); }
        
        .footer { text-align: center; padding-top: 40px; font-size: 0.75rem; color: var(--text-dim); }
        .footer a { color: inherit; text-decoration: none; }
        .footer a:hover { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 메인으로</a>
        <header>
            <h1>펫 뽑기 확률표</h1>
            <p>제작: 블랙해머</p>
        </header>

        <div class="tab-nav">
            <button class="tab-btn active" data-tab="gold">💰 골드 뽑기</button>
            <button class="tab-btn" data-tab="diamond">💎 다이아 뽑기</button>
        </div>

        <div id="gold" class="tab-content active"></div>
        <div id="diamond" class="tab-content"></div>

        <div class="footer">© 2026 얼음짭 · <a href="credits.html">크레딧</a></div>
    </div>

    <script>
        // 펫 데이터
        const petData = {
            gold: {
                title: '펫 골드 뽑기 확률',
                pity: 100,
                table: [
                    { grade: 'S', prob: '1.3%', color: 'var(--grade-s)' },
                    { grade: 'A', prob: '18.7%', color: 'var(--grade-a)' },
                    { grade: 'B', prob: '80%', color: 'var(--grade-b)' }
                ],
                pityTable: [{ grade: 'S', prob: '100%', color: 'var(--grade-s)' }],
                grades: {
                    S: { pets: ['쁘띠 버서커', '쁘띠 나이트', '쁘띠 매지션', '미니 드래곤', '천마', '기린'], each: '0.2167%' },
                    A: { pets: ['미니 피어이터', '미니 데몬', '미니 맘모스', '미니 엔진 머신', '클로', '미호', '미카', '벨제', '미후왕'], each: '2.0778%' },
                    B: { pets: ['미니 늑대', '미니 해골늑대', '미니 네크로 리퍼', '미니 드루이드 소울', '미니 블랙해머', '크로아', '미믹', '포츈', '도레미', '부두', '호크', '픽시'], each: '6.6667%' }
                },
                pityGrades: {
                    S: { pets: ['쁘띠 버서커', '쁘띠 나이트', '쁘띠 매지션', '미니 드래곤', '천마', '기린'], each: '16.6667%' }
                }
            },
            diamond: {
                title: '펫 다이아 뽑기 확률',
                table: [
                    { grade: 'A', prob: '1.5%', color: 'var(--grade-a)' },
                    { grade: 'B', prob: '13.5%', color: 'var(--grade-b)' },
                    { grade: 'C', prob: '25%', color: 'var(--grade-c)' },
                    { grade: 'D', prob: '60%', color: 'var(--grade-d)' }
                ],
                grades: {
                    A: { pets: ['미니 피어이터', '미니 데몬', '미니 맘모스', '미니 엔진 머신', '클로', '미호', '미카', '벨제', '미후왕'], each: '0.1667%', total: '1.5%' },
                    B: { pets: ['미니 늑대', '미니 해골늑대', '미니 네크로 리퍼', '미니 드루이드 소울', '미니 블랙해머', '크로아', '미믹', '포츈', '도레미', '부두', '호크', '픽시'], each: '1.125%', total: '13.5%' },
                    C: { pets: ['미니 오크', '미니 거미', '미니 곰', '노드', '너굴', '네코', '타임', '버니'], each: '3.125%', total: '25%' },
                    D: { pets: ['미니 고블린', '미니 유령', '오덕', '이누', '허밍'], each: '12%', total: '60%' }
                }
            }
        };

        // HTML 생성 함수
        const createPetItem = (name, prob) => `
            <div class="pet-item">
                <div class="pet-icon"><img src="images/pets/${name}.png" alt="${name}"></div>
                <div class="pet-name">${name}</div>
                <div class="pet-sub">${prob}</div>
            </div>`;

        const createGradeRow = (grade, data) => `
            <div class="row ${grade}">
                <div class="row-head">
                    <div class="left-head">
                        <span class="dot"></span>
                        <span class="grade">${grade} 등급</span>
                    </div>
                    <div class="prob">${data.total ? `총 ${data.total} (각 ${data.each})` : `각 ${data.each}`}</div>
                </div>
                <div class="pet-grid">${data.pets.map(p => createPetItem(p, data.each)).join('')}</div>
            </div>`;

        const createTable = (rows, title) => `
            <div class="table-box">
                <div class="table-box-title">${title}</div>
                <table>
                    <thead><tr><th>수치</th><th>등급</th><th>등장확률</th></tr></thead>
                    <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td style="color:${r.color};font-weight:700">${r.grade}</td><td>${r.prob}</td></tr>`).join('')}</tbody>
                </table>
            </div>`;

        // 골드 뽑기 렌더링
        document.getElementById('gold').innerHTML = `
            <div class="card">
                <div class="section-title">
                    <h2>${petData.gold.title}</h2>
                    <span class="pill">확정(pity) ${petData.gold.pity}회</span>
                </div>
                <div class="table-grid">
                    ${createTable(petData.gold.table, '📦 골드 뽑기')}
                    ${createTable(petData.gold.pityTable, '🎁 확정 뽑기 (100번째)')}
                </div>
                <div class="hr"></div>
                <div class="section-title"><h2>펫 등장확률</h2><span class="pill">등급 내 균등</span></div>
                <div class="rows">${Object.entries(petData.gold.grades).map(([g, d]) => createGradeRow(g, d)).join('')}</div>
                <div class="hr"></div>
                <div class="section-title"><h2>🎁 확정 뽑기 (100번째)</h2><span class="pill">S 등급 내 균등</span></div>
                <div class="rows">${Object.entries(petData.gold.pityGrades).map(([g, d]) => createGradeRow(g, { ...d, total: 'S 100%' })).join('')}</div>
            </div>`;

        // 다이아 뽑기 렌더링
        document.getElementById('diamond').innerHTML = `
            <div class="card">
                <div class="section-title">
                    <h2>${petData.diamond.title}</h2>
                    <span class="pill">다이아 뽑기</span>
                </div>
                <div class="table-box" style="max-width:400px">
                    <div class="table-box-title">💎 다이아 뽑기</div>
                    <table>
                        <thead><tr><th>수치</th><th>등급</th><th>등장확률</th></tr></thead>
                        <tbody>${petData.diamond.table.map((r, i) => `<tr><td>${i + 1}</td><td style="color:${r.color};font-weight:700">${r.grade}</td><td>${r.prob}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
                <div class="hr"></div>
                <div class="section-title"><h2>펫 등장확률</h2><span class="pill">등급 내 균등</span></div>
                <div class="grade-info">
                    <div><span class="grade-dot" style="background:var(--grade-a)"></span> A 등급 (9종): 각 0.1667%</div>
                    <div><span class="grade-dot" style="background:var(--grade-b)"></span> B 등급 (12종): 각 1.125%</div>
                    <div><span class="grade-dot" style="background:var(--grade-c)"></span> C 등급 (8종): 각 3.125%</div>
                    <div><span class="grade-dot" style="background:var(--grade-d)"></span> D 등급 (5종): 각 12%</div>
                </div>
                <div class="hr"></div>
                <div class="rows">${Object.entries(petData.diamond.grades).map(([g, d]) => createGradeRow(g, d)).join('')}</div>
            </div>`;

        // 탭 기능
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
