<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13타워 도우미 - 성지키기 헬퍼</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn.active {
            background: #6366f1;
            border-color: #6366f1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 타이머 */
        .timer-display {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .current-time {
            font-size: 3.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
        }

        .current-round {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .timer-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-btn {
            background: #22c55e;
            color: #fff;
        }

        .start-btn:hover {
            background: #16a34a;
        }

        .start-btn:disabled {
            background: #374151;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #ef4444;
            color: #fff;
        }

        .reset-btn:hover {
            background: #dc2626;
        }

        /* 알람 설정 */
        .alarm-section h3 {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .round-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .round-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .round-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .round-item.selected {
            background: rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
        }

        .round-item.current {
            border-color: #22c55e;
            box-shadow: 0 0 0 1px #22c55e;
        }

        .round-item.passed {
            opacity: 0.4;
        }

        .round-num {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .round-time {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* 몹 정보 */
        .mob-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }

        .mob-table th,
        .mob-table td {
            padding: 12px 10px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.15);
            vertical-align: middle;
        }

        .mob-table th {
            background: rgba(99, 102, 241, 0.2);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .mob-table th:first-child {
            text-align: center;
        }

        .mob-table tr:last-child td {
            border-bottom: none;
        }

        .mob-table .round-cell {
            font-weight: 600;
            width: 80px;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
        }

        .mob-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mob-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mob-item.important {
            color: #f59e0b;
            font-weight: 600;
        }

        .mob-dir {
            font-size: 0.75rem;
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* 알람 효과 */
        .alarm-active {
            animation: alarm-pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes alarm-pulse {
            from { background: rgba(239, 68, 68, 0.3); }
            to { background: rgba(239, 68, 68, 0.6); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 메인으로</a>

        <header>
            <h1>13타워 도우미</h1>
        </header>

        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="timer">⏱️ 타이머</button>
            <button class="tab-btn" data-tab="mobinfo">👾 몹 정보</button>
        </nav>

        <!-- 타이머 탭 -->
        <section id="timer" class="tab-content active">
            <div class="timer-display">
                <div class="current-time" id="timerDisplay">0:00</div>
                <div class="current-round" id="roundDisplay">시작 전</div>
            </div>

            <div class="timer-controls">
                <button class="timer-btn start-btn" id="startBtn">▶ 시작</button>
                <button class="timer-btn reset-btn" id="resetBtn">↺ 리셋</button>
            </div>

            <div class="alarm-section">
                <h3>🔔 알람 설정 (클릭하여 선택)</h3>
                <div class="round-list" id="roundList"></div>
            </div>
        </section>

        <!-- 몹 정보 탭 -->
        <section id="mobinfo" class="tab-content">
            <div class="table-container">
                <table class="mob-table">
                    <thead>
                        <tr>
                            <th>라운드</th>
                            <th>주요 몹</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="round-cell">3</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item important">거미 <span class="mob-dir">오른쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">4</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">고블린보스 <span class="mob-dir">왼쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">6</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">고블린보스 <span class="mob-dir">오른쪽</span></div>
                                    <div class="mob-item important">거미 <span class="mob-dir">양쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">9</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">고블린보스 <span class="mob-dir">왼쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">10</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item important">해골킹 <span class="mob-dir">왼쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">12</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">망치 <span class="mob-dir">오른쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">13</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">고블린보스 <span class="mob-dir">오른쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">14</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item important">해골킹 <span class="mob-dir">왼쪽</span></div>
                                    <div class="mob-item important">거미 <span class="mob-dir">양쪽</span></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="round-cell">15</td>
                            <td>
                                <div class="mob-list">
                                    <div class="mob-item">고블린보스 <span class="mob-dir">왼쪽</span></div>
                                    <div class="mob-item important">새 <span class="mob-dir">오른쪽</span></div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // 라운드 데이터 (초 단위)
        const ROUNDS = [
            { round: 1, time: 0 },
            { round: 2, time: 16 },
            { round: 3, time: 33 },
            { round: 4, time: 53 },
            { round: 5, time: 74 },
            { round: 6, time: 98 },
            { round: 7, time: 115 },
            { round: 8, time: 133 },
            { round: 9, time: 150 },
            { round: 10, time: 169 },
            { round: 11, time: 185 },
            { round: 12, time: 201 },
            { round: 13, time: 218 },
            { round: 14, time: 230 },
            { round: 15, time: 255 }
        ];

        let timerInterval = null;
        let elapsedSeconds = 0;
        let isRunning = false;
        let selectedAlarms = new Set();
        let alarmAudio = null;

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            initRoundList();
            initTimer();
            initAlarmSound();
        });

        function initAlarmSound() {
            // Web Audio API로 비프음 생성
            alarmAudio = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playAlarm() {
            if (!alarmAudio) return;
            
            const oscillator = alarmAudio.createOscillator();
            const gainNode = alarmAudio.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(alarmAudio.destination);
            
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, alarmAudio.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, alarmAudio.currentTime + 0.5);
            
            oscillator.start(alarmAudio.currentTime);
            oscillator.stop(alarmAudio.currentTime + 0.5);

            // 두 번째 비프
            setTimeout(() => {
                const osc2 = alarmAudio.createOscillator();
                const gain2 = alarmAudio.createGain();
                osc2.connect(gain2);
                gain2.connect(alarmAudio.destination);
                osc2.frequency.value = 1100;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.3, alarmAudio.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, alarmAudio.currentTime + 0.5);
                osc2.start(alarmAudio.currentTime);
                osc2.stop(alarmAudio.currentTime + 0.5);
            }, 200);
        }

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                });
            });
        }

        function initRoundList() {
            const list = document.getElementById('roundList');
            
            // localStorage에서 저장된 알람 불러오기
            const saved = localStorage.getItem('towerAlarms');
            if (saved) {
                JSON.parse(saved).forEach(r => selectedAlarms.add(r));
            }
            
            ROUNDS.forEach(r => {
                const item = document.createElement('div');
                item.className = 'round-item';
                if (selectedAlarms.has(r.round)) {
                    item.classList.add('selected');
                }
                item.dataset.round = r.round;
                item.innerHTML = `
                    <span class="round-num">${r.round}라</span>
                    <span class="round-time">${formatTime(r.time)}</span>
                `;
                item.addEventListener('click', () => toggleAlarm(r.round));
                list.appendChild(item);
            });
        }

        function toggleAlarm(round) {
            const item = document.querySelector(`.round-item[data-round="${round}"]`);
            if (selectedAlarms.has(round)) {
                selectedAlarms.delete(round);
                item.classList.remove('selected');
            } else {
                selectedAlarms.add(round);
                item.classList.add('selected');
            }
            // localStorage에 저장
            localStorage.setItem('towerAlarms', JSON.stringify([...selectedAlarms]));
        }

        function initTimer() {
            document.getElementById('startBtn').addEventListener('click', startTimer);
            document.getElementById('resetBtn').addEventListener('click', resetTimer);
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '진행 중...';

            timerInterval = setInterval(() => {
                elapsedSeconds++;
                updateDisplay();
                checkAlarms();
            }, 1000);
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            elapsedSeconds = 0;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '▶ 시작';
            document.getElementById('timerDisplay').textContent = '0:00';
            document.getElementById('timerDisplay').classList.remove('alarm-active');
            document.getElementById('roundDisplay').textContent = '시작 전';

            document.querySelectorAll('.round-item').forEach(item => {
                item.classList.remove('current', 'passed');
            });
        }

        function updateDisplay() {
            document.getElementById('timerDisplay').textContent = formatTime(elapsedSeconds);
            
            // 현재 라운드 찾기
            let currentRound = 1;
            for (let i = ROUNDS.length - 1; i >= 0; i--) {
                if (elapsedSeconds >= ROUNDS[i].time) {
                    currentRound = ROUNDS[i].round;
                    break;
                }
            }

            document.getElementById('roundDisplay').textContent = `${currentRound}라운드 진행 중`;

            // 라운드 표시 업데이트
            document.querySelectorAll('.round-item').forEach(item => {
                const round = parseInt(item.dataset.round);
                item.classList.remove('current', 'passed');
                
                if (round === currentRound) {
                    item.classList.add('current');
                } else if (round < currentRound) {
                    item.classList.add('passed');
                }
            });
        }

        function checkAlarms() {
            for (const r of ROUNDS) {
                if (selectedAlarms.has(r.round) && elapsedSeconds === r.time) {
                    playAlarm();
                    triggerAlarmEffect();
                    break;
                }
            }
        }

        function triggerAlarmEffect() {
            const display = document.getElementById('timerDisplay');
            display.classList.add('alarm-active');
            setTimeout(() => display.classList.remove('alarm-active'), 2000);
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }
    </script>
    <footer style="text-align:center;padding:30px 0 10px;opacity:0.3;font-size:0.75rem;">© 2026 CDO Helper. All Rights Reserved.</footer>
</body>
</html>
